<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<meta
  name="theme-color"
  content="#0B7A3E">

<link
  rel="icon"
  type="image/png"
  href="RPS.png">

<title>RAIDALL Sales Assistant</title>

<style>

/* ===================================================
   GLOBAL
   =================================================== */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
}

body {

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background: #F5F7FA;

  color: #333;

}

button,
input {
  font-family: inherit;
}

.app {

  max-width: 760px;

  margin: auto;

  min-height: 100vh;

}


/* ===================================================
   HOME HEADER
   =================================================== */

.app-header {

  padding: 28px 20px 20px;

  text-align: center;

}

.rps-logo {

  width: 260px;

  max-width: 82%;

  max-height: 90px;

  object-fit: contain;

  display: block;

  margin: 0 auto;

}

.app-logo {

  width: 150px;

  max-width: 60%;

}

.app-title {

  margin-top: 8px;

  font-size: 20px;

  color: #567;

}


/* ===================================================
   REFRESH BUTTON
   =================================================== */

.refresh-button {

  position: fixed;

  right: 18px;

  bottom: 18px;

  z-index: 100;

  width: 52px;

  height: 52px;

  border: none;

  border-radius: 50%;

  background: #0B7A3E;

  color: white;

  font-size: 24px;

  cursor: pointer;

  box-shadow:
    0 6px 20px rgba(0,0,0,.20);

}

.refresh-button:active {

  transform: scale(.94);

}

.refresh-button.loading {

  animation: spin .8s linear infinite;

}

@keyframes spin {

  from { transform: rotate(0deg); }

  to   { transform: rotate(360deg); }

}


/* ===================================================
   SECTION
   =================================================== */

.division-section {

  padding: 0 20px 80px;

}

.section-title {

  font-size: 20px;

  font-weight: 700;

  margin-bottom: 18px;

}


/* ===================================================
   DIVISION CARD
   =================================================== */

.division-card {

  width: 100%;

  border: none;

  background: white;

  border-radius: 22px;

  margin-bottom: 18px;

  padding: 22px;

  display: flex;

  align-items: center;

  text-align: left;

  cursor: pointer;

  box-shadow:
    0 8px 25px rgba(0,0,0,.08);

  transition: .2s;

}

.division-card:hover {

  transform: translateY(-2px);

}

.division-icon {

  width: 100px;

  height: 78px;

  display: flex;

  align-items: center;

  justify-content: center;

  flex-shrink: 0;

}

.division-logo {

  width: 88px;

  max-height: 72px;

  object-fit: contain;

  display: block;

}

.division-content {

  flex: 1;

  padding-left: 20px;

}

.division-name {

  font-size: 23px;

  font-weight: 800;

}

.division-description {

  margin-top: 5px;

  font-size: 15px;

  color: #667;

  line-height: 1.4;

}

.division-arrow {

  font-size: 34px;

  color: #999;

}


/* ===================================================
   PET CARE
   =================================================== */

.petcare {

  border-left: 9px solid #F28C28;

}

.petcare .division-name {

  color: #F28C28;

}


/* ===================================================
   LIVESTOCK
   =================================================== */

.livestock {

  border-left: 9px solid #0B7A3E;

}

.livestock .division-name {

  color: #0B7A3E;

}


/* ===================================================
   AQUA
   =================================================== */

.aquaculture {

  border-left: 9px solid #087EA4;

}

.aquaculture .division-name {

  color: #087EA4;

}


/* ===================================================
   PAGE
   =================================================== */

.page {

  display: none;

}

.page.active {

  display: block;

}


/* ===================================================
   DIVISION HEADER
   =================================================== */

.division-header {

  position: sticky;

  top: 0;

  z-index: 10;

  background: white;

  padding: 12px 20px;

  display: flex;

  align-items: center;

  gap: 14px;

  border-bottom: 1px solid #eee;

}

.back-button {

  border: none;

  background: #F5F5F5;

  border-radius: 12px;

  padding: 10px 15px;

  cursor: pointer;

  font-size: 15px;

  flex-shrink: 0;

}

.division-header-logo {

  width: 58px;

  height: 46px;

  object-fit: contain;

  flex-shrink: 0;

}

.division-header-title {

  font-size: 22px;

  font-weight: 800;

  line-height: 1.15;

}


/* ===================================================
   SEARCH
   =================================================== */

.search-container {

  padding: 18px 20px;

}

.search-input {

  width: 100%;

  padding: 16px 18px;

  border-radius: 15px;

  border: 1px solid #ddd;

  font-size: 16px;

  outline: none;

  background: white;

}

.search-input:focus {

  border-color: #0B7A3E;

}


/* ===================================================
   PRODUCT AREA
   =================================================== */

.product-container {

  padding: 0 20px 80px;

}

.product-count {

  margin-bottom: 15px;

  color: #667;

  font-size: 15px;

}


/* ===================================================
   PRODUCT CARD
   =================================================== */

.product-card {

  background: white;

  border-radius: 18px;

  padding: 18px;

  margin-bottom: 14px;

  box-shadow:
    0 5px 18px rgba(0,0,0,.07);

  cursor: pointer;

  transition: .2s;

}

.product-card:hover {

  transform: translateY(-2px);

  box-shadow:
    0 8px 24px rgba(0,0,0,.10);

}

.product-name {

  font-size: 18px;

  font-weight: 800;

  color: #0B7A3E;

}

.product-meta {

  margin-top: 7px;

  color: #667;

  font-size: 14px;

  line-height: 1.5;

}

.product-variants {

  margin-top: 12px;

}

.product-variant {

  display: inline-block;

  margin-right: 5px;

  margin-bottom: 5px;

  padding: 6px 10px;

  border-radius: 20px;

  background: #E8F6EE;

  color: #0B7A3E;

  font-size: 13px;

  font-weight: 700;

}

.product-detail-hint {

  margin-top: 14px;

  font-size: 13px;

  font-weight: 700;

  color: #999;

  text-align: right;

}


/* ===================================================
   DETAIL
   =================================================== */

.detail-card {

  background: white;

  border-radius: 18px;

  padding: 22px;

  box-shadow:
    0 5px 18px rgba(0,0,0,.07);

}

.detail-division-logo {

  width: 110px;

  max-height: 80px;

  object-fit: contain;

  display: block;

  margin: 0 auto 18px;

}

.detail-section {

  margin-top: 20px;

}

.detail-label {

  font-size: 14px;

  font-weight: 800;

  color: #555;

  margin-bottom: 6px;

}

.detail-value {

  font-size: 15px;

  line-height: 1.6;

  color: #444;

}

.detail-image {

  width: 100%;

  max-width: 320px;

  display: block;

  margin: 0 auto 20px;

  border-radius: 14px;

}


/* ===================================================
   LOADING
   =================================================== */

.loading {

  text-align: center;

  padding: 50px 20px;

  color: #667;

}


/* ===================================================
   ERROR
   =================================================== */

.error {

  margin: 20px;

  padding: 20px;

  border-radius: 15px;

  background: #fff0f0;

  color: #b00020;

}


/* ===================================================
   EMPTY
   =================================================== */

.empty {

  text-align: center;

  padding: 60px 20px;

  color: #777;

  background: white;

  border-radius: 18px;

  box-shadow:
    0 5px 18px rgba(0,0,0,.05);

}

.empty-title {

  font-size: 18px;

  font-weight: 800;

  margin-bottom: 8px;

  color: #555;

}

.empty-text {

  font-size: 14px;

  line-height: 1.5;

}


/* ===================================================
   MOBILE
   =================================================== */

@media (max-width: 600px) {

  .rps-logo {

    width: 230px;

    max-width: 88%;

  }

  .division-icon {

    width: 78px;

  }

  .division-logo {

    width: 70px;

    max-height: 62px;

  }

  .division-content {

    padding-left: 14px;

  }

  .division-name {

    font-size: 20px;

  }

  .division-description {

    font-size: 14px;

  }

  .division-header-title {

    font-size: 19px;

  }

  .division-header-logo {

    width: 48px;

    height: 40px;

  }

}


/* ===================================================
   SMALL MOBILE
   =================================================== */

@media (max-width: 380px) {

  .division-card {

    padding: 18px 14px;

  }

  .division-icon {

    width: 65px;

  }

  .division-logo {

    width: 62px;

  }

  .division-content {

    padding-left: 10px;

  }

  .division-name {

    font-size: 18px;

  }

  .division-description {

    font-size: 13px;

  }

}

</style>

</head>


<body>

<div class="app">


<!-- ===================================================
     HOME PAGE
     =================================================== -->

<section
  id="homePage"
  class="page active">

  <header class="app-header">

    <!-- RPS LOGO -->
    <img
      id="homeRpsLogo"
      src="RPS.png"
      alt="PT Rizki Piara Sejahtera"
      class="rps-logo">

    <div class="app-title">
      RAIDALL<br>
      <span>Sales Assistant</span>
    </div>

  </header>


  <section class="division-section">

    <div class="section-title">
      Pilih Divisi
    </div>


    <!-- PET CARE -->

    <button
      class="division-card petcare"
      type="button"
      onclick="openDivision('PETCARE')">

      <div class="division-icon">

        <img
          id="homePetcareLogo"
          src="IMAGE/RAIDALL_PETCARE.png"
          alt="RAID ALL Pet Care"
          class="division-logo">

      </div>

      <div class="division-content">

        <div class="division-name">
          PET CARE
        </div>

        <div class="division-description">
          Produk kesehatan dan perawatan hewan kesayangan
        </div>

      </div>

      <div class="division-arrow">
        ›
      </div>

    </button>


    <!-- LIVESTOCK -->

    <button
      class="division-card livestock"
      type="button"
      onclick="openDivision('LIVESTOCK')">

      <div class="division-icon">

        <img
          id="homeLivestockLogo"
          src="IMAGE/RAIDALL_LIVESTOCK.png"
          alt="RAID ALL Livestock"
          class="division-logo">

      </div>

      <div class="division-content">

        <div class="division-name">
          LIVESTOCK
        </div>

        <div class="division-description">
          Produk kesehatan dan nutrisi hewan ternak
        </div>

      </div>

      <div class="division-arrow">
        ›
      </div>

    </button>


    <!-- AQUACULTURE -->

    <button
      class="division-card aquaculture"
      type="button"
      onclick="openDivision('AQUACULTURE')">

      <div class="division-icon">

        <img
          id="homeAquacultureLogo"
          src="IMAGE/RAIDALL_AQUACULTURE.png"
          alt="RAID ALL Aquaculture"
          class="division-logo">

      </div>

      <div class="division-content">

        <div class="division-name">
          AQUA CULTURE
        </div>

        <div class="division-description">
          Produk kesehatan dan perawatan ikan
        </div>

      </div>

      <div class="division-arrow">
        ›
      </div>

    </button>

  </section>

</section>


<!-- ===================================================
     DIVISION PRODUCT PAGE
     =================================================== -->

<section
  id="divisionPage"
  class="page">

  <header
    id="divisionHeader"
    class="division-header">

    <button
      class="back-button"
      type="button"
      onclick="goHome()">

      ← Home

    </button>

    <img
      id="divisionHeaderLogo"
      class="division-header-logo"
      src=""
      alt="RAID ALL">

    <div
      id="divisionTitle"
      class="division-header-title">

      LIVESTOCK

    </div>

  </header>


  <div class="search-container">

    <input
      id="searchInput"
      class="search-input"
      type="search"
      placeholder="Cari produk...">

  </div>


  <div
    id="productContainer"
    class="product-container">

    <div class="loading">
      Memuat produk...
    </div>

  </div>

</section>


<!-- ===================================================
     PRODUCT DETAIL PAGE
     =================================================== -->

<section
  id="productDetailPage"
  class="page">

  <header
    class="division-header">

    <button
      class="back-button"
      type="button"
      onclick="closeProductDetail()">

      ← Kembali

    </button>

    <img
      id="productDetailDivisionLogo"
      class="division-header-logo"
      src=""
      alt="RAID ALL">

    <div
      id="productDetailTitle"
      class="division-header-title">

      Detail Produk

    </div>

  </header>


  <div
    id="productDetailContainer"
    class="product-container">

    <div class="loading">
      Memuat detail produk...
    </div>

  </div>

</section>


</div>


<!-- ===================================================
     FLOATING REFRESH BUTTON
     =================================================== -->

<button
  id="refreshButton"
  class="refresh-button"
  type="button"
  onclick="refreshApp()"
  aria-label="Refresh aplikasi"
  title="Refresh aplikasi">

  ↻

</button>


<script>

/* ===================================================
   API CONFIG
   =================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbyjekI9Vt7x4aqiyIekVPnvGMgRn9bJKJmifey0h0bBps-F3FqTAnKJfCqXOnD-Ak-cFw/exec";


/* ===================================================
   LOGO CONFIG
   =================================================== */

/*
 * Nama file PNG di folder IMAGE GitHub.
 *
 * Jika nama file Anda berbeda, cukup ubah
 * empat nama di bawah ini.
 */

const LOGOS = {

  RPS:
    "RPS.png",

  PETCARE:
    "IMAGE/RAIDALL_PETCARE.png",

  LIVESTOCK:
    "IMAGE/RAIDALL_LIVESTOCK.png",

  AQUACULTURE:
    "IMAGE/RAIDALL_AQUACULTURE.png"

};


/* ===================================================
   STATE
   =================================================== */

let currentDivision = "";

let allProducts = [];

let searchTimer = null;


/* ===================================================
   IMAGE CACHE BUSTER
   =================================================== */

function assetUrl(path) {

  return (
    path +
    "?v=" +
    encodeURIComponent(
      window.__APP_VERSION__ ||
      "20260809"
    )
  );

}


/* ===================================================
   SAFE IMAGE LOADER
   =================================================== */

function setImage(
  element,
  path
) {

  if (!element || !path) {
    return;
  }

  element.src = assetUrl(path);

}


/* ===================================================
   INITIALIZE LOGOS
   =================================================== */

function initLogos() {

  setImage(
    document.getElementById("homeRpsLogo"),
    LOGOS.RPS
  );

  setImage(
    document.getElementById("homePetcareLogo"),
    LOGOS.PETCARE
  );

  setImage(
    document.getElementById("homeLivestockLogo"),
    LOGOS.LIVESTOCK
  );

  setImage(
    document.getElementById("homeAquacultureLogo"),
    LOGOS.AQUACULTURE
  );

}


/* ===================================================
   DIVISION LOGO
   =================================================== */

function getDivisionLogo(
  division
) {

  const key =
    String(
      division || ""
    )
    .trim()
    .toUpperCase();

  return (
    LOGOS[key] ||
    LOGOS.RPS
  );

}


/* ===================================================
   DIVISION NAME
   =================================================== */

function getDivisionName(
  division
) {

  const names = {

    LIVESTOCK:
      "LIVESTOCK",

    PETCARE:
      "PET CARE",

    AQUACULTURE:
      "AQUA CULTURE"

  };

  return (
    names[
      String(
        division || ""
      )
      .trim()
      .toUpperCase()
    ] ||
    division
  );

}


/* ===================================================
   APPLY DIVISION HEADER
   =================================================== */

function applyDivisionHeader(
  division
) {

  const logo =
    document.getElementById(
      "divisionHeaderLogo"
    );

  if (logo) {

    setImage(
      logo,
      getDivisionLogo(division)
    );

    logo.alt =
      "RAID ALL " +
      getDivisionName(division);

  }


  const detailLogo =
    document.getElementById(
      "productDetailDivisionLogo"
    );

  if (detailLogo) {

    setImage(
      detailLogo,
      getDivisionLogo(division)
    );

    detailLogo.alt =
      "RAID ALL " +
      getDivisionName(division);

  }

}


/* ===================================================
   OPEN DIVISION
   =================================================== */

async function openDivision(
  division
) {

  currentDivision =
    String(
      division || ""
    )
    .trim()
    .toUpperCase();


  /*
   * Pastikan hanya division page yang aktif
   */

  document
    .getElementById("homePage")
    .classList.remove("active");

  document
    .getElementById("productDetailPage")
    .classList.remove("active");

  document
    .getElementById("divisionPage")
    .classList.add("active");


  /*
   * Header
   */

  document
    .getElementById("divisionTitle")
    .textContent =
      getDivisionName(
        currentDivision
      );


  /*
   * Division logo
   */

  applyDivisionHeader(
    currentDivision
  );


  /*
   * Reset search
   */

  document
    .getElementById("searchInput")
    .value = "";


  /*
   * Loading
   */

  document
    .getElementById("productContainer")
    .innerHTML =

      `<div class="loading">
        Memuat produk...
       </div>`;


  /*
   * Reset data lama
   */

  allProducts = [];


  /*
   * Load data baru
   */

  await loadProducts();

}


/* ===================================================
   LOAD PRODUCTS
   =================================================== */

async function loadProducts(
  search = ""
) {

  try {

    let url =
      API_URL +
      "?api=1&action=products" +
      "&division=" +
      encodeURIComponent(
        currentDivision
      ) +
      "&_=" +
      Date.now();


    if (search) {

      url +=
        "&search=" +
        encodeURIComponent(
          search
        );

    }


    const response =
      await fetch(
        url,
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "HTTP Error " +
        response.status
      );

    }


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.error ||
        "API Error"
      );

    }


    let products =
      Array.isArray(
        result.data
      )
        ? result.data
        : [];


    /*
     * DOUBLE PROTECTION DIVISION
     *
     * Jangan pernah biarkan data
     * divisi lain masuk.
     */

    products =
      products.filter(
        product => {

          const productDivision =
            String(
              product.Division ||
              ""
            )
            .trim()
            .toUpperCase();


          return (
            productDivision ===
            currentDivision
          );

        }
      );


    allProducts =
      products;


    console.log(
      "FRONTEND PRODUCT RESULT:",
      JSON.stringify(
        allProducts
      )
    );


    renderProducts(
      products
    );


  } catch (error) {

    console.error(
      "loadProducts:",
      error
    );


    document
      .getElementById(
        "productContainer"
      )
      .innerHTML =

      `<div class="error">

        Gagal memuat data produk.

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>`;

  }

}


/* ===================================================
   RENDER PRODUCTS
   =================================================== */

function renderProducts(
  products
) {

  const container =
    document.getElementById(
      "productContainer"
    );


  /*
   * EMPTY DATABASE
   */

  if (
    !products ||
    !products.length
  ) {

    container.innerHTML =

      `<div class="empty">

        <div class="empty-title">
          Database Belum Tersedia
        </div>

        <div class="empty-text">

          Data produk untuk divisi

          <strong>
            ${escapeHtml(
              getDivisionName(
                currentDivision
              )
            )}
          </strong>

          belum tersedia.

        </div>

      </div>`;

    return;

  }


  /*
   * API SEKARANG SUDAH MENGIRIM
   * 1 PRODUCT + ARRAY VARIANTS
   */

  const productList =
    products.filter(
      product => {

        const code =
          String(
            product.ProductCode ||
            ""
          ).trim();

        return (
          code !== ""
        );

      }
    );


  /*
   * PRODUCT COUNT
   */

  let html =

    `<div class="product-count">

      Total Product :
      <strong>
        ${productList.length}
      </strong>

    </div>`;


  /*
   * PRODUCT CARD
   */

  productList.forEach(
    product => {

      let variantsHtml = "";


      const variants =
        Array.isArray(
          product.Variants
        )
          ? product.Variants
          : [];


      variants.forEach(
        variant => {

          const variantName =
            variant.Variant ||
            "-";


          const variantPrice =
            variant.Price ||
            "-";


          variantsHtml +=

            `<span
              class="product-variant">

              ${escapeHtml(
                variantName
              )}

              &nbsp;

              <strong>

                ${escapeHtml(
                  formatPrice(
                    variantPrice
                  )
                )}

              </strong>

            </span>`;

        }
      );


      if (!variants.length) {

        variantsHtml =

          `<span
            class="product-variant">

            -

          </span>`;

      }


      html +=

        `<div
          class="product-card"
          data-product-code="${escapeHtml(
            product.ProductCode
          )}">


          <div class="product-name">

            ${escapeHtml(
              product.ProductName ||
              "-"
            )}

          </div>


          <div class="product-meta">

            ${escapeHtml(
              product.Category ||
              "-"
            )}

            •

            ${escapeHtml(
              product.Species ||
              "-"
            )}

          </div>


          <div class="product-variants">

            ${variantsHtml}

          </div>


          <div class="product-detail-hint">

            Lihat Detail ›

          </div>


        </div>`;

    });


  container.innerHTML =
    html;


  /*
   * CLICK PRODUCT CARD
   */

  const cards =
    container.querySelectorAll(
      ".product-card"
    );


  cards.forEach(
    card => {

      card.addEventListener(
        "click",
        function() {

          const code =
            this.dataset
              .productCode;

          openProductDetail(
            code
          );

        }
      );

    }
  );

}


/* ===================================================
   OPEN PRODUCT DETAIL
   =================================================== */

function openProductDetail(
  productCode
) {

  const code =
    String(
      productCode || ""
    ).trim();


  /*
   * Cari product dari API result
   */

  const product =
    allProducts.find(
      item => {

        return (
          String(
            item.ProductCode ||
            ""
          ).trim() ===
          code
        );

      }
    );


  if (!product) {

    alert(
      "Detail produk tidak ditemukan."
    );

    return;

  }


  /*
   * Variants
   */

  const variants =
    Array.isArray(
      product.Variants
    )
      ? product.Variants
      : [];


  let variantsHtml = "";


  variants.forEach(
    variant => {

      variantsHtml +=

        `<span
          class="product-variant">

          ${escapeHtml(
            variant.Variant ||
            "-"
          )}

          &nbsp;

          <strong>

            ${escapeHtml(
              formatPrice(
                variant.Price
              )
            )}

          </strong>

        </span>`;

    }
  );


  if (!variants.length) {

    variantsHtml =

      `<span
        class="product-variant">

        -

      </span>`;

  }


  /*
   * Hide all page
   */

  document
    .getElementById(
      "homePage"
    )
    .classList.remove(
      "active"
    );

  document
    .getElementById(
      "divisionPage"
    )
    .classList.remove(
      "active"
    );


  /*
   * Show detail
   */

  document
    .getElementById(
      "productDetailPage"
    )
    .classList.add(
      "active"
    );


  /*
   * Header logo
   */

  applyDivisionHeader(
    product.Division ||
    currentDivision
  );


  /*
   * Title
   */

  document
    .getElementById(
      "productDetailTitle"
    )
    .textContent =
      product.ProductName ||
      "Detail Produk";


  /*
   * Image
   */

  let imageHtml = "";


  if (
    product.Image &&
    String(
      product.Image
    ).trim()
  ) {

    imageHtml =

      `<img
        class="detail-image"
        src="${escapeHtml(
          product.Image
        )}"
        alt="${escapeHtml(
          product.ProductName ||
          ""
        )}"
        onerror="
          this.style.display='none';
        ">`;

  }


  /*
   * DETAIL HTML
   */

  const container =
    document.getElementById(
      "productDetailContainer"
    );


  container.innerHTML =

    `<div class="detail-card">

      ${imageHtml}


      <img
        class="detail-division-logo"
        src="${assetUrl(
          getDivisionLogo(
            product.Division ||
            currentDivision
          )
        )}"
        alt="${escapeHtml(
          getDivisionName(
            product.Division ||
            currentDivision
          )
        )}">


      <div class="product-name">

        ${escapeHtml(
          product.ProductName ||
          "-"
        )}

      </div>


      <div class="detail-section">

        <div class="detail-label">
          Product Code
        </div>

        <div class="detail-value">

          ${escapeHtml(
            product.ProductCode ||
            "-"
          )}

        </div>

      </div>


      <div class="detail-section">

        <div class="detail-label">
          Division
        </div>

        <div class="detail-value">

          ${escapeHtml(
            getDivisionName(
              product.Division ||
              currentDivision
            )
          )}

        </div>

      </div>


      <div class="detail-section">

        <div class="detail-label">
          Category
        </div>

        <div class="detail-value">

          ${escapeHtml(
            product.Category ||
            "-"
          )}

        </div>

      </div>


      <div class="detail-section">

        <div class="detail-label">
          Species
        </div>

        <div class="detail-value">

          ${escapeHtml(
            product.Species ||
            "-"
          )}

        </div>

      </div>


      <div class="detail-section">

        <div class="detail-label">
          Variant & Price
        </div>

        <div class="product-variants">

          ${variantsHtml}

        </div>

      </div>


      <div class="detail-section">

        <div class="detail-label">
          Composition
        </div>

        <div class="detail-value">

          ${escapeHtml(
            product.Composition ||
            "-"
          )}

        </div>

      </div>


      <div class="detail-section">

        <div class="detail-label">
          Function
        </div>

        <div class="detail-value">

          ${escapeHtml(
            product.Function ||
            "-"
          )}

        </div>

      </div>


      <div class="detail-section">

        <div class="detail-label">
          Description
        </div>

        <div class="detail-value">

          ${escapeHtml(
            product.Description ||
            "-"
          )}

        </div>

      </div>


      <div class="detail-section">

        <div class="detail-label">
          Problem / Symptom
        </div>

        <div class="detail-value">

          ${escapeHtml(
            product.Problem_Symptom ||
            "-"
          )}

        </div>

      </div>


      <div class="detail-section">

        <div class="detail-label">
          Usage
        </div>

        <div class="detail-value">

          ${escapeHtml(
            product.Usage ||
            "-"
          )}

        </div>

      </div>

    </div>`;

}

/* ===================================================
   FORMAT PRICE
   =================================================== */

function formatPrice(
  value
) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return "-";

  }


  const text =
    String(value).trim();


  const number =
    Number(
      text.replace(
        /[^\d.-]/g,
        ""
      )
    );


  if (
    isNaN(number)
  ) {

    return text;

  }


  return (
    "Rp" +
    number.toLocaleString(
      "id-ID"
    )
  );

}


/* ===================================================
   HTML ESCAPE
   =================================================== */

function escapeHtml(
  value
) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* ===================================================
   REFRESH APP
   =================================================== */

/*
 * Ini tombol refresh untuk Android / browser.
 *
 * Yang dilakukan:
 * 1. Meminta browser mengambil HTML terbaru.
 * 2. Memberikan timestamp agar URL tidak dianggap
 *    sebagai halaman lama.
 * 3. API juga memakai timestamp sehingga data
 *    Spreadsheet terbaru langsung diambil.
 */

function refreshApp() {

  const button =
    document.getElementById(
      "refreshButton"
    );


  if (button) {

    button.classList.add(
      "loading"
    );

  }


  const separator =
    window.location.href
      .includes("?")
      ? "&"
      : "?";


  window.location.href =
    window.location.pathname +
    separator +
    "refresh=" +
    Date.now();

}
