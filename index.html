<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <meta
    name="theme-color"
    content="#0B7A3E">

  <meta
    name="mobile-web-app-capable"
    content="yes">

  <meta
    name="apple-mobile-web-app-capable"
    content="yes">

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default">

  <link
    rel="manifest"
    href="./manifest.json">

<title>RAIDALL Sales Assistant</title>

<style>

/* =========================================================
   RAIDALL SALES ASSISTANT - FINAL INDEX
   FRONTEND ONLY
   Backend getProducts() sudah melakukan:
   Division Filter + ProductCode Grouping + Variants[]
   ========================================================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #F5F7FA;
  color: #333;
}

button,
input {
  font-family: inherit;
}

button {
  -webkit-tap-highlight-color: transparent;
}

.app {
  width: 100%;
  max-width: 760px;
  min-height: 100vh;
  margin: 0 auto;
  padding-bottom: 40px;
}

/* =========================================================
   HOME
   ========================================================= */

.page {
  display: none;
}

.page.active {
  display: block;
}

.app-header {
  padding: 28px 20px 22px;
  text-align: center;
}

.rps-logo {
  width: 260px;
  max-width: 82%;
  height: auto;
  display: block;
  margin: 0 auto;
}

.app-brand {
  margin-top: 10px;
  font-size: 36px;
  line-height: 1;
  font-weight: 900;
  letter-spacing: 1px;
  color: #087A3E;
}

.app-title {
  margin-top: 8px;
  font-size: 20px;
  color: #567;
}

.division-section {
  padding: 0 20px 40px;
}

.section-title {
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 18px;
}

/* =========================================================
   DIVISION CARD
   ========================================================= */

.division-card {
  width: 100%;
  border: 0;
  border-left: 9px solid transparent;
  background: #FFF;
  border-radius: 22px;
  margin-bottom: 18px;
  padding: 22px 20px;
  display: flex;
  align-items: center;
  text-align: left;
  cursor: pointer;
  box-shadow: 0 8px 25px rgba(0,0,0,.08);
  transition: transform .15s ease, box-shadow .15s ease;
}

.division-card:active {
  transform: scale(.99);
}

.division-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 28px rgba(0,0,0,.10);
}

.division-logo-box {
  width: 110px;
  height: 78px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.division-logo {
  max-width: 100%;
  max-height: 74px;
  width: auto;
  height: auto;
  object-fit: contain;
}

.division-content {
  flex: 1;
  padding-left: 20px;
}

.division-name {
  font-size: 23px;
  font-weight: 800;
}

.division-description {
  margin-top: 5px;
  font-size: 15px;
  color: #667;
  line-height: 1.4;
}

.division-arrow {
  font-size: 34px;
  color: #999;
  padding-left: 10px;
}

/* PET CARE */
.petcare {
  border-left-color: #F28C28;
}

.petcare .division-name {
  color: #F28C28;
}

/* LIVESTOCK */
.livestock {
  border-left-color: #0B7A3E;
}

.livestock .division-name {
  color: #0B7A3E;
}

/* AQUACULTURE */
.aquaculture {
  border-left-color: #087EA4;
}

.aquaculture .division-name {
  color: #087EA4;
}

/* =========================================================
   DIVISION HEADER
   ========================================================= */

.division-header {
  background: #FFF;
  padding: 18px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  box-shadow: 0 2px 10px rgba(0,0,0,.04);
}

.back-button {
  border: 0;
  background: #F5F5F5;
  border-radius: 16px;
  padding: 11px 17px;
  font-size: 16px;
  cursor: pointer;
  white-space: nowrap;
}

.division-header-logo-box {
  width: 78px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.division-header-logo {
  max-width: 78px;
  max-height: 50px;
  width: auto;
  height: auto;
  object-fit: contain;
}

.division-header-title {
  font-size: 28px;
  font-weight: 900;
  line-height: 1.1;
}

.header-petcare .division-header-title {
  color: #F28C28;
}

.header-livestock .division-header-title {
  color: #0B7A3E;
}

.header-aquaculture .division-header-title {
  color: #087EA4;
}

/* =========================================================
   SEARCH
   ========================================================= */

.search-container {
  padding: 22px 20px 10px;
}

.search-input {
  width: 100%;
  border: 1px solid #DDD;
  border-radius: 18px;
  background: #FFF;
  padding: 16px 20px;
  font-size: 18px;
  outline: none;
  box-shadow: 0 3px 12px rgba(0,0,0,.03);
}

.search-input:focus {
  border-color: #0B7A3E;
}

/* =========================================================
   PRODUCTS
   ========================================================= */

.product-container {
  padding: 0 20px 30px;
}

.product-count {
  padding: 8px 2px 14px;
  font-size: 16px;
  color: #567;
}

.product-card {
  background: #FFF;
  border-radius: 20px;
  margin-bottom: 16px;
  padding: 20px;
  box-shadow: 0 6px 20px rgba(0,0,0,.07);
  cursor: pointer;
}

.product-card:active {
  transform: scale(.995);
}

.product-name {
  font-size: 19px;
  line-height: 1.25;
  font-weight: 800;
  color: #0B7A3E;
}

.product-meta {
  margin-top: 8px;
  color: #667;
  font-size: 14px;
  line-height: 1.4;
}

.product-variants {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 13px;
}

.product-variant {
  display: inline-block;
  padding: 7px 11px;
  border-radius: 20px;
  background: #E8F6EE;
  color: #0B7A3E;
  font-size: 13px;
  font-weight: 700;
}

.product-detail-hint {
  margin-top: 14px;
  text-align: right;
  color: #999;
  font-size: 14px;
}

/* =========================================================
   DETAIL
   ========================================================= */

.detail-card {
  background: #FFF;
  border-radius: 20px;
  padding: 22px;
  box-shadow: 0 6px 20px rgba(0,0,0,.07);
}

.detail-image-wrap {
  text-align: center;
  margin: 8px 0 20px;
}

.detail-image {
  max-width: 320px;
  width: 100%;
  max-height: 320px;
  object-fit: contain;
  border-radius: 12px;
  cursor: pointer;
}

.detail-section {
  background: #FFF;
  border-radius: 18px;
  margin-top: 14px;
  padding: 18px;
  box-shadow: 0 4px 15px rgba(0,0,0,.05);
}

.detail-label {
  font-size: 15px;
  font-weight: 800;
  margin-bottom: 8px;
  color: #555;
}

.variant-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.variant-btn {
  border: 0;
  border-radius: 20px;
  padding: 9px 13px;
  background: #E8F6EE;
  color: #0B7A3E;
  font-weight: 700;
  cursor: pointer;
}

.price {
  font-size: 22px;
  font-weight: 900;
  color: #0B7A3E;
}

.copy-button {
  width: 100%;
  border: 0;
  border-radius: 14px;
  padding: 14px;
  background: #0B7A3E;
  color: #FFF;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
}

/* =========================================================
   STATUS
   ========================================================= */

.loading {
  text-align: center;
  padding: 55px 20px;
  color: #667;
}

.empty {
  text-align: center;
  padding: 55px 20px;
  background: #FFF;
  border-radius: 20px;
  color: #777;
  box-shadow: 0 6px 20px rgba(0,0,0,.06);
}

.error {
  padding: 20px;
  margin-top: 15px;
  border-radius: 18px;
  background: #FFF0F0;
  color: #B00020;
}

/* =========================================================
   REFRESH BUTTON
   ========================================================= */

.refresh-button {
  position: fixed;
  right: 22px;
  bottom: 22px;
  z-index: 9999;

  width: 62px;
  height: 62px;

  border: 0;
  border-radius: 50%;

  background: #0B7A3E;
  color: #FFF;

  font-size: 30px;
  line-height: 1;

  box-shadow: 0 8px 25px rgba(0,0,0,.22);

  cursor: pointer;
}

.refresh-button:active {
  transform: scale(.94);
}

.refresh-button.loading {
  animation: spin .8s linear infinite;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* =========================================================
   IMAGE VIEWER
   ========================================================= */

.image-viewer {
  position: fixed;
  inset: 0;
  z-index: 10000;
  background: rgba(0,0,0,.88);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 25px;
}

.image-viewer.hidden {
  display: none;
}

.zoom-image {
  max-width: 95vw;
  max-height: 90vh;
  object-fit: contain;
}

.close-image {
  position: fixed;
  right: 22px;
  top: 18px;
  color: #FFF;
  font-size: 32px;
  cursor: pointer;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 600px) {

  .rps-logo {
    width: 230px;
  }

  .app-brand {
    font-size: 32px;
  }

  .division-card {
    padding: 18px 14px;
  }

  .division-logo-box {
    width: 82px;
    height: 68px;
  }

  .division-logo {
    max-height: 62px;
    max-width: 82px;
  }

  .division-content {
    padding-left: 13px;
  }

  .division-name {
    font-size: 20px;
  }

  .division-description {
    font-size: 14px;
  }

  .division-header-title {
    font-size: 23px;
  }

  .division-header-logo-box {
    width: 64px;
  }

  .division-header-logo {
    max-width: 64px;
    max-height: 44px;
  }

  .refresh-button {
    right: 18px;
    bottom: 18px;
  }
}

</style>

</head>


<body>

<div class="app">


<!-- =========================================================

  <header class="app-header">

    <!--

<script>

/* =========================================================
   API CONFIG
   ========================================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbyjekI9Vt7x4aqiyIekVPnvGMgRn9bJKJmifey0h0bBps-F3FqTAnKJfCqXOnD-Ak-cFw/exec";


/* =========================================================
   IMAGE CONFIG
   ========================================================= */

const IMAGE_BASE =
  "https://raw.githubusercontent.com/kusmantohadie79/raidall-sales-assistant/main/IMAGE/";

const DIVISION_CONFIG = {

  PETCARE: {
    name: "PET CARE",
    logo: IMAGE_BASE + "RAIDALL_PETCARE.png",
    color: "#F28C28"
  },

  LIVESTOCK: {
    name: "LIVESTOCK",
    logo: IMAGE_BASE + "RAIDALL_LIVESTOCK.png",
    color: "#0B7A3E"
  },

  AQUACULTURE: {
    name: "AQUA CULTURE",
    logo: IMAGE_BASE + "RAIDALL_AQUACULTURE.png",
    color: "#087EA4"
  }

};


/* =========================================================
   STATE
   ========================================================= */

let currentDivision = "";

let allProducts = [];

let currentProduct = null;

let currentVariantIndex = 0;

let searchTimer = null;


/* =========================================================
   START
   ========================================================= */

window.addEventListener("load", function() {

  /*
   * Home tidak perlu memanggil API.
   * Data hanya dipanggil saat user memilih division.
   */

  console.log(
    "RAIDALL Sales Assistant loaded."
  );

});


/* =========================================================
   DIVISION
   ========================================================= */

function getDivisionName(division) {

  const config =
    DIVISION_CONFIG[division];

  return config
    ? config.name
    : division;

}


/* =========================================================
   OPEN DIVISION
   ========================================================= */

async function openDivision(division) {

  currentDivision =
    String(division || "")
      .trim()
      .toUpperCase();


  const config =
    DIVISION_CONFIG[currentDivision];


  if (!config) {

    console.error(
      "Unknown division:",
      currentDivision
    );

    return;

  }


  currentProduct = null;

  currentVariantIndex = 0;

  allProducts = [];


  /*
   * PAGE SWITCH
   */

  showPage("divisionPage");


  /*
   * HEADER
   */

  const header =
    document.getElementById(
      "divisionHeader"
    );

  header.className =
    "division-header header-" +
    currentDivision.toLowerCase();


  document
    .getElementById("divisionTitle")
    .textContent =
      config.name;


  const headerLogo =
    document.getElementById(
      "divisionHeaderLogo"
    );

  headerLogo.src =
    config.logo;


  /*
   * SEARCH RESET
   */

  document
    .getElementById("searchInput")
    .value = "";


  /*
   * LOADING
   */

  document
    .getElementById("productContainer")
    .innerHTML =
      `<div class="loading">
        Memuat produk...
       </div>`;


  await loadProducts();

}


/* =========================================================
   LOAD PRODUCTS
   IMPORTANT:
   Backend sudah mengembalikan:
   ProductCode
   ProductName
   ...
   Variants[]

   FRONTEND TIDAK MELAKUKAN GROUPING LAGI.
   ========================================================= */

async function loadProducts(search = "") {

  if (!currentDivision) {
    return;
  }


  try {

    let url =
      API_URL +
      "?api=1" +
      "&action=products" +
      "&division=" +
      encodeURIComponent(
        currentDivision
      ) +
      "&status=ALL" +
      "&_=" +
      Date.now();


    if (search) {

      url +=
        "&search=" +
        encodeURIComponent(
          search
        );

    }


    console.log(
      "API REQUEST:",
      url
    );


    const response =
      await fetch(
        url,
        {
          method: "GET",
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "HTTP Error " +
        response.status
      );

    }


    const result =
      await response.json();


    console.log(
      "FRONTEND PRODUCT RESULT:",
      result.data
    );


    if (!result.success) {

      throw new Error(
        result.error ||
        "API Error"
      );

    }


    /*
     * IMPORTANT:
     * Tidak ada grouped[] di sini.
     */

    allProducts =
      Array.isArray(
        result.data
      )
        ? result.data
        : [];


    renderProducts(
      allProducts
    );


  } catch (error) {

    console.error(
      "LOAD PRODUCTS ERROR:",
      error
    );


    document
      .getElementById(
        "productContainer"
      )
      .innerHTML =

      `<div class="error">

        <strong>
          Gagal memuat data produk.
        </strong>

        <br><br>

        ${escapeHtml(
          error.message ||
          "Unknown error"
        )}

      </div>`;

  }

}


/* =========================================================
   RENDER PRODUCTS
   ========================================================= */

function renderProducts(products) {

  const container =
    document.getElementById(
      "productContainer"
    );


  if (
    !Array.isArray(products) ||
    products.length === 0
  ) {

    container.innerHTML =

      `<div class="empty">

        <strong>
          Database Belum Tersedia
        </strong>

        <br><br>

        Data produk untuk divisi
        <strong>
          ${escapeHtml(
            getDivisionName(
              currentDivision
            )
          )}
        </strong>
        belum tersedia.

      </div>`;

    return;

  }


  /*
   * Backend sudah grouping.
   * Satu element = satu ProductCode.
   */

  let html = "";


  html +=

    `<div class="product-count">

      Total Product :
      <strong>
        ${products.length}
      </strong>

    </div>`;


  products.forEach(
    function(product) {

      const variants =
        Array.isArray(
          product.Variants
        )
          ? product.Variants
          : [];


      let variantsHTML = "";


      variants.forEach(
        function(variant) {

          variantsHTML +=

            `<span class="product-variant">

              ${escapeHtml(
                variant.Variant || "-"
              )}

              &nbsp;

              <strong>
                ${money(
                  variant.Price
                )}
              </strong>

            </span>`;

        }
      );


      html +=

        `<div
          class="product-card"
          onclick="openProductDetail(
            '${escapeAttribute(
              product.ProductCode
            )}'
          )">

          <div class="product-name">

            ${escapeHtml(
              product.ProductName ||
              "-"
            )}

          </div>


          <div class="product-meta">

            ${escapeHtml(
              product.Category ||
              "-"
            )}

            •&#x20;

            ${escapeHtml(
              product.Species ||
              "-"
            )}

          </div>


          <div class="product-variants">

            ${variantsHTML}

          </div>


          <div class="product-detail-hint">

            Lihat Detail ›

          </div>

        </div>`;

    }
  );


  container.innerHTML =
    html;

}


/* =========================================================
   PRODUCT DETAIL
   ========================================================= */

function openProductDetail(
  productCode
) {

  const code =
    String(
      productCode || ""
    ).trim();


  const product =
    allProducts.find(
      function(item) {

        return String(
          item.ProductCode || ""
        ).trim() === code;

      }
    );


  if (!product) {

    alert(
      "Detail produk tidak ditemukan."
    );

    return;

  }


  currentProduct =
    product;


  currentVariantIndex = 0;


  const config =
    DIVISION_CONFIG[
      currentDivision
    ];


  showPage(
    "productDetailPage"
  );


  /*
   * HEADER
   */

  const detailLogo =
    document.getElementById(
      "detailHeaderLogo"
    );

  detailLogo.src =
    config
      ? config.logo
      : "";


  const detailHeader =
    document.querySelector(
      "#productDetailPage .division-header"
    );


  if (detailHeader) {

    detailHeader.className =
      "division-header header-" +
      currentDivision.toLowerCase();

  }


  document
    .getElementById(
      "productDetailTitle"
    )
    .textContent =
      product.ProductName ||
      "Detail Produk";


  renderProductDetail();

}


/* =========================================================
   RENDER DETAIL
   ========================================================= */

function renderProductDetail() {

  if (!currentProduct) {
    return;
  }


  const product =
    currentProduct;


  const variants =
    Array.isArray(
      product.Variants
    )
      ? product.Variants
      : [];


  if (
    currentVariantIndex < 0 ||
    currentVariantIndex >= variants.length
  ) {

    currentVariantIndex = 0;

  }


  const variant =
    variants.length
      ? variants[
          currentVariantIndex
        ]
      : {
          Variant: "-",
          Price: 0
        };


  let variantHTML =
    "";


  variants.forEach(
    function(item, index) {

      const active =
        index ===
        currentVariantIndex;


      variantHTML +=

        `<button
          type="button"
          class="variant-btn"
          style="${
            active
              ? "background:#0B7A3E;color:#FFF;"
              : ""
          }"
          onclick="selectVariant(
            ${index}
          )">

          ${escapeHtml(
            item.Variant || "-"
          )}

        </button>`;

    }
  );


  const imageHTML =
    product.Image
      ? `

        <div class="detail-image-wrap">

          <img
            class="detail-image"
            src="${escapeAttribute(
              product.Image
            )}"
            alt="${escapeAttribute(
              product.ProductName ||
              "Product Image"
            )}"
            onclick="openImage(
              '${escapeAttribute(
                product.Image
              )}'
            )">

        </div>

        `
      : `

        <div
          style="
            text-align:center;
            color:#999;
            padding:20px;
          ">

          Image Not Available

        </div>

        `;


  const container =
    document.getElementById(
      "productDetailContainer"
    );


  container.innerHTML =

    `

    <div class="detail-card">

      <div class="product-name">

        ${escapeHtml(
          product.ProductName ||
          "-"
        )}

      </div>


      <div class="product-meta">

        Product Code :
        <strong>
          ${escapeHtml(
            product.ProductCode ||
            "-"
          )}
        </strong>

      </div>


      <div class="product-meta">

        ${escapeHtml(
          product.Category ||
          "-"
        )}

        •&#x20;

        ${escapeHtml(
          product.Species ||
          "-"
        )}

      </div>


      ${imageHTML}


      <div class="detail-section">

        <div class="detail-label">
          Variant
        </div>

        <div class="variant-buttons">

          ${variantHTML}

        </div>

      </div>


      <div class="detail-section">

        <div class="detail-label">
          Harga
        </div>

        <div class="price">

          ${money(
            variant.Price
          )}

        </div>

      </div>


      <div class="detail-section">

        <div class="detail-label">
          Composition
        </div>

        ${formatText(
          product.Composition
        )}

      </div>


      <div class="detail-section">

        <div class="detail-label">
          Function
        </div>

        ${formatText(
          product.Function
        )}

      </div>


      <div class="detail-section">

        <div class="detail-label">
          Description
        </div>

        ${formatText(
          product.Description
        )}

      </div>


      <div class="detail-section">

        <div class="detail-label">
          Cara Penggunaan
        </div>

        ${formatText(
          product.Usage
        )}

      </div>


      <div class="detail-section">

        <div class="detail-label">
          Problem / Symptom
        </div>

        ${formatText(
          product.Problem_Symptom
        )}

      </div>


      <div class="detail-section">

        <button
          type="button"
          class="copy-button"
          onclick="copyWA()">

          📋 Copy WhatsApp

        </button>

      </div>

    </div>

    `;

}


/* =========================================================
   SELECT VARIANT
   ========================================================= */

function selectVariant(index) {

  currentVariantIndex =
    Number(index) || 0;


  renderProductDetail();

}


/* =========================================================
   CLOSE DETAIL
   ========================================================= */

function closeProductDetail() {

  showPage(
    "divisionPage"
  );

}


/* =========================================================
   HOME
   ========================================================= */

function goHome() {

  currentDivision = "";

  allProducts = [];

  currentProduct = null;

  currentVariantIndex = 0;


  showPage(
    "homePage"
  );

}


/* =========================================================
   PAGE SWITCH
   ========================================================= */

function showPage(
  pageId
) {

  document
    .querySelectorAll(".page")
    .forEach(
      function(page) {

        page.classList.remove(
          "active"
        );

      }
    );


  const page =
    document.getElementById(
      pageId
    );


  if (page) {

    page.classList.add(
      "active"
    );

  }


  window.scrollTo(
    0,
    0
  );

}


/* =========================================================
   SEARCH
   ========================================================= */

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    function() {

      clearTimeout(
        searchTimer
      );


      const keyword =
        this.value.trim();


      searchTimer =
        setTimeout(
          function() {

            loadProducts(
              keyword
            );

          },
          350
        );

    }
  );


/* =========================================================
   REFRESH APP
   =========================================================
   Tombol ini:
   1. Membersihkan state frontend.
   2. Reload halaman dengan cache-buster.
   3. Tidak bergantung pada service worker.

   Cocok untuk Android/PWA.
   ========================================================= */

function refreshApp() {

  const button =
    document.getElementById(
      "refreshButton"
    );


  if (button) {

    button.classList.add(
      "loading"
    );

  }


  /*
   * Kalau sedang berada di division,
   * cukup ambil data terbaru dari API.
   * Tidak perlu reload seluruh aplikasi.
   */

  if (
    currentDivision &&
    document
      .getElementById(
        "divisionPage"
      )
      .classList.contains(
        "active"
      )
  ) {

    const search =
      document
        .getElementById(
          "searchInput"
        )
        .value
        .trim();


    loadProducts(
      search
    )
      .finally(
        function() {

          if (button) {

            button.classList.remove(
              "loading"
            );

          }

        }
      );

    return;

  }


  /*
   * Kalau di Home / Detail:
   * reload halaman penuh dengan
   * timestamp agar browser Android
   * tidak memakai HTML lama.
   */

  const base =
    window.location.href
      .split("?")[0];


  window.location.href =
    base +
    "?v=" +
    Date.now();

}


/* =========================================================
   IMAGE
   ========================================================= */

function openImage(url) {

  if (!url) {
    return;
  }


  const viewer =
    document.getElementById(
      "imageViewer"
    );


  const image =
    document.getElementById(
      "zoomImage"
    );


  image.src =
    url;


  viewer.classList.remove(
    "hidden"
  );

}


function closeImageViewer() {

  document
    .getElementById(
      "imageViewer"
    )
    .classList.add(
      "hidden"
    );

}


/* =========================================================
   COPY WHATSAPP
   ========================================================= */

async function copyWA() {

  if (!currentProduct) {
    return;
  }


  const variants =
    Array.isArray(
      currentProduct.Variants
    )
      ? currentProduct.Variants
      : [];


  const variant =
    variants[
      currentVariantIndex
    ] || {
      Variant: "-",
      Price: 0
    };


  const text =

`*${currentProduct.ProductName || "-"}*

📦 Variant
${variant.Variant || "-"}

💰 Harga
${money(variant.Price)}

🐾 Species
${currentProduct.Species || "-"}

🧪 Composition
${currentProduct.Composition || "-"}

⚙ Function
${currentProduct.Function || "-"}

📝 Description
${currentProduct.Description || "-"}

📖 Cara Penggunaan
${currentProduct.Usage || "-"}

PT. Rizki Piara Sejahtera`;


  try {

    await navigator.clipboard.writeText(
      text
    );

    alert(
      "Informasi berhasil dicopy."
    );

  } catch (error) {

    console.error(
      error
    );

    alert(
      "Tidak dapat menyalin otomatis. Silakan copy manual."
    );

  }

}


/* =========================================================
   FORMAT RUPIAH
   ========================================================= */

function money(value) {

  const number =
    Number(
      String(
        value ?? ""
      ).replace(
        /[^0-9.-]/g,
        ""
      )
    ) || 0;


  return new Intl.NumberFormat(
    "id-ID",
    {
      style: "currency",
      currency: "IDR",
      minimumFractionDigits: 0
    }
  ).format(
    number
  );

}


/* =========================================================
   TEXT
   ========================================================= */

function formatText(value) {

  const text =
    String(
      value ?? ""
    ).trim();


  if (!text) {
    return "-";
  }


  return escapeHtml(
    text
  ).replace(
    /\n/g,
    "<br>"
  );

}


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHtml(value) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   ATTRIBUTE ESCAPE
   ========================================================= */

function escapeAttribute(value) {

  return escapeHtml(
    value
  )
    .replace(
      /`/g,
      "&#096;"
    );

}
