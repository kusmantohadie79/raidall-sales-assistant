<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>RAIDALL Sales Assistant</title>

<style>

/* ===================================================
   GLOBAL
   =================================================== */

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background: #F5F7FA;

  color: #333;

}

.app {

  max-width: 760px;

  margin: auto;

  min-height: 100vh;

}


/* ===================================================
   HOME HEADER
   =================================================== */

.app-header {

  padding: 28px 20px 20px;

  text-align: center;

}

.app-logo {

  width: 150px;

  max-width: 60%;

}

.app-title {

  margin-top: 10px;

  font-size: 20px;

  color: #567;

}


/* ===================================================
   SECTION
   =================================================== */

.division-section {

  padding: 0 20px 40px;

}

.section-title {

  font-size: 20px;

  font-weight: 700;

  margin-bottom: 18px;

}


/* ===================================================
   DIVISION CARD
   =================================================== */

.division-card {

  width: 100%;

  border: none;

  background: white;

  border-radius: 22px;

  margin-bottom: 18px;

  padding: 22px;

  display: flex;

  align-items: center;

  text-align: left;

  cursor: pointer;

  box-shadow:
    0 8px 25px rgba(0,0,0,.08);

  transition: .2s;

}

.division-card:hover {

  transform: translateY(-2px);

}

.division-icon {

  width: 70px;

  height: 70px;

  border-radius: 18px;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 34px;

  flex-shrink: 0;

}

.division-content {

  flex: 1;

  padding-left: 20px;

}

.division-name {

  font-size: 23px;

  font-weight: 800;

}

.division-description {

  margin-top: 5px;

  font-size: 15px;

  color: #667;

  line-height: 1.4;

}

.division-arrow {

  font-size: 34px;

  color: #999;

}


/* ===================================================
   PET CARE
   =================================================== */

.petcare {

  border-left: 9px solid #F28C28;

}

.petcare .division-icon {

  background: #FFF1E5;

}

.petcare .division-name {

  color: #F28C28;

}


/* ===================================================
   LIVESTOCK
   =================================================== */

.livestock {

  border-left: 9px solid #0B7A3E;

}

.livestock .division-icon {

  background: #E8F6EE;

}

.livestock .division-name {

  color: #0B7A3E;

}


/* ===================================================
   AQUA
   =================================================== */

.aquaculture {

  border-left: 9px solid #087EA4;

}

.aquaculture .division-icon {

  background: #E7F4FC;

}

.aquaculture .division-name {

  color: #087EA4;

}


/* ===================================================
   PAGE
   =================================================== */

.page {

  display: none;

}

.page.active {

  display: block;

}


/* ===================================================
   DIVISION HEADER
   =================================================== */

.division-header {

  position: sticky;

  top: 0;

  z-index: 10;

  background: white;

  padding: 15px 20px;

  display: flex;

  align-items: center;

  gap: 15px;

  border-bottom: 1px solid #eee;

}

.back-button {

  border: none;

  background: #F5F5F5;

  border-radius: 12px;

  padding: 10px 15px;

  cursor: pointer;

  font-size: 15px;

}

.division-header-title {

  font-size: 22px;

  font-weight: 800;

}


/* ===================================================
   SEARCH
   =================================================== */

.search-container {

  padding: 18px 20px;

}

.search-input {

  width: 100%;

  padding: 16px 18px;

  border-radius: 15px;

  border: 1px solid #ddd;

  font-size: 16px;

  outline: none;

}

.search-input:focus {

  border-color: #0B7A3E;

}


/* ===================================================
   PRODUCT AREA
   =================================================== */

.product-container {

  padding: 0 20px 40px;

}

.product-count {

  margin-bottom: 15px;

  color: #667;

  font-size: 15px;

}


/* ===================================================
   PRODUCT CARD
   =================================================== */

.product-card {

  background: white;

  border-radius: 18px;

  padding: 18px;

  margin-bottom: 14px;

  box-shadow:
    0 5px 18px rgba(0,0,0,.07);

  cursor: pointer;

  transition: .2s;

}

.product-card:hover {

  transform: translateY(-2px);

  box-shadow:
    0 8px 24px rgba(0,0,0,.10);

}

.product-name {

  font-size: 18px;

  font-weight: 800;

  color: #0B7A3E;

}

.product-meta {

  margin-top: 7px;

  color: #667;

  font-size: 14px;

  line-height: 1.5;

}

.product-variants {

  margin-top: 12px;

}

.product-variant {

  display: inline-block;

  margin-right: 5px;

  margin-bottom: 5px;

  padding: 6px 10px;

  border-radius: 20px;

  background: #E8F6EE;

  color: #0B7A3E;

  font-size: 13px;

  font-weight: 700;

}

.product-detail-hint {

  margin-top: 14px;

  font-size: 13px;

  font-weight: 700;

  color: #999;

  text-align: right;

}


/* ===================================================
   DETAIL
   =================================================== */

.detail-card {

  background: white;

  border-radius: 18px;

  padding: 22px;

  box-shadow:
    0 5px 18px rgba(0,0,0,.07);

}

.detail-section {

  margin-top: 20px;

}

.detail-label {

  font-size: 14px;

  font-weight: 800;

  color: #555;

  margin-bottom: 6px;

}

.detail-value {

  font-size: 15px;

  line-height: 1.6;

  color: #444;

}

.detail-image {

  width: 100%;

  max-width: 320px;

  display: block;

  margin: 0 auto 20px;

  border-radius: 14px;

}


/* ===================================================
   LOADING
   =================================================== */

.loading {

  text-align: center;

  padding: 50px 20px;

  color: #667;

}


/* ===================================================
   ERROR
   =================================================== */

.error {

  margin: 20px;

  padding: 20px;

  border-radius: 15px;

  background: #fff0f0;

  color: #b00020;

}


/* ===================================================
   EMPTY
   =================================================== */

.empty {

  text-align: center;

  padding: 60px 20px;

  color: #777;

  background: white;

  border-radius: 18px;

  box-shadow:
    0 5px 18px rgba(0,0,0,.05);

}

.empty-title {

  font-size: 18px;

  font-weight: 800;

  margin-bottom: 8px;

  color: #555;

}

.empty-text {

  font-size: 14px;

  line-height: 1.5;

}


/* ===================================================
   MOBILE
   =================================================== */

@media (max-width: 600px) {

  .division-name {

    font-size: 20px;

  }

  .division-description {

    font-size: 14px;

  }

  .division-icon {

    width: 60px;

    height: 60px;

    font-size: 28px;

  }

}

</style>

</head>


<body>


<div class="app">


<!-- ===================================================
     HOME PAGE
     =================================================== -->

<section
  id="homePage"
  class="page active">

  <header class="app-header">

    <img
      src="IMAGE/logo.png"
      alt="RAID ALL"
      class="app-logo">

    <div class="app-title">
      Sales Assistant
    </div>

  </header>


  <section class="division-section">

    <div class="section-title">
      Pilih Divisi
    </div>


    <!-- PET CARE -->

    <button
      class="division-card petcare"
      onclick="openDivision('PETCARE')">

      <div class="division-icon">
        🐾
      </div>

      <div class="division-content">

        <div class="division-name">
          PET CARE
        </div>

        <div class="division-description">
          Produk kesehatan dan perawatan hewan kesayangan
        </div>

      </div>

      <div class="division-arrow">
        ›
      </div>

    </button>


    <!-- LIVESTOCK -->

    <button
      class="division-card livestock"
      onclick="openDivision('LIVESTOCK')">

      <div class="division-icon">
        🐔
      </div>

      <div class="division-content">

        <div class="division-name">
          LIVESTOCK
        </div>

        <div class="division-description">
          Produk kesehatan dan nutrisi hewan ternak
        </div>

      </div>

      <div class="division-arrow">
        ›
      </div>

    </button>


    <!-- AQUACULTURE -->

    <button
      class="division-card aquaculture"
      onclick="openDivision('AQUACULTURE')">

      <div class="division-icon">
        🐟
      </div>

      <div class="division-content">

        <div class="division-name">
          AQUA CULTURE
        </div>

        <div class="division-description">
          Produk kesehatan dan perawatan ikan
        </div>

      </div>

      <div class="division-arrow">
        ›
      </div>

    </button>

  </section>

</section>



<!-- ===================================================
     DIVISION PRODUCT PAGE
     =================================================== -->

<section
  id="divisionPage"
  class="page">

  <header
    id="divisionHeader"
    class="division-header">

    <button
      class="back-button"
      type="button"
      onclick="goHome()">

      ← Home

    </button>

    <div
      id="divisionTitle"
      class="division-header-title">

      LIVESTOCK

    </div>

  </header>


  <div class="search-container">

    <input
      id="searchInput"
      class="search-input"
      type="search"
      placeholder="Cari produk...">

  </div>


  <div
    id="productContainer"
    class="product-container">

    <div class="loading">
      Memuat produk...
    </div>

  </div>

</section>



<!-- ===================================================
     PRODUCT DETAIL PAGE
     =================================================== -->

<section
  id="productDetailPage"
  class="page">

  <header
    class="division-header">

    <button
      class="back-button"
      type="button"
      onclick="closeProductDetail()">

      ← Kembali

    </button>

    <div
      id="productDetailTitle"
      class="division-header-title">

      Detail Produk

    </div>

  </header>


  <div
    id="productDetailContainer"
    class="product-container">

    <div class="loading">
      Memuat detail produk...
    </div>

  </div>

</section>


</div>



<script>

/* ===================================================
   API CONFIG
   =================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbyjekI9Vt7x4aqiyIekVPnvGMgRn9bJKJmifey0h0bBps-F3FqTAnKJfCqXOnD-Ak-cFw/exec";


/* ===================================================
   STATE
   =================================================== */

let currentDivision = "";

let allProducts = [];

let searchTimer = null;


/* ===================================================
   DIVISION NAME
   =================================================== */

function getDivisionName(division) {

  const names = {

    LIVESTOCK:
      "LIVESTOCK",

    PETCARE:
      "PET CARE",

    AQUACULTURE:
      "AQUA CULTURE"

  };

  return names[division] || division;

}


/* ===================================================
   OPEN DIVISION
   =================================================== */

async function openDivision(division) {

  currentDivision =
    String(division || "")
      .trim()
      .toUpperCase();


  /*
   * Pastikan hanya division page yang aktif
   */

  document
    .getElementById("homePage")
    .classList.remove("active");

  document
    .getElementById("productDetailPage")
    .classList.remove("active");

  document
    .getElementById("divisionPage")
    .classList.add("active");


  /*
   * Header
   */

  document
    .getElementById("divisionTitle")
    .textContent =
      getDivisionName(currentDivision);


  /*
   * Reset search
   */

  document
    .getElementById("searchInput")
    .value = "";


  /*
   * Loading
   */

  document
    .getElementById("productContainer")
    .innerHTML =

      `<div class="loading">
        Memuat produk...
       </div>`;


  /*
   * Reset data lama
   */

  allProducts = [];


  /*
   * Load data baru
   */

  await loadProducts();

}


/* ===================================================
   LOAD PRODUCTS
   =================================================== */

async function loadProducts(search = "") {

  try {

    let url =
      API_URL +
      "?api=1&action=products" +
      "&division=" +
      encodeURIComponent(currentDivision);


    if (search) {

      url +=
        "&search=" +
        encodeURIComponent(search);

    }


    const response =
      await fetch(url, {
        cache: "no-store"
      });


    if (!response.ok) {

      throw new Error(
        "HTTP Error " +
        response.status
      );

    }


    const result =
      await response.json();


    if (!result.success) {

      throw new Error(
        result.error ||
        "API Error"
      );

    }


    let products =
      Array.isArray(result.data)
        ? result.data
        : [];


    /*
     * =================================================
     * DOUBLE PROTECTION DIVISION
     *
     * Jangan pernah biarkan data Livestock
     * masuk ke Pet Care / Aqua.
     * =================================================
     */

    products =
      products.filter(product => {

        const productDivision =
          String(
            product.Division || ""
          )
          .trim()
          .toUpperCase();


        return (
          productDivision ===
          currentDivision
        );

      });


    allProducts = products;

    console.log(
      "FRONTEND PRODUCT RESULT:",
      JSON.stringify(allProducts)
    );

    renderProducts(products);


  } catch (error) {

    console.error(
      "loadProducts:",
      error
    );


    document
      .getElementById("productContainer")
      .innerHTML =

      `<div class="error">

        Gagal memuat data produk.

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>`;

  }

}


/* ===================================================
   RENDER PRODUCTS
   =================================================== */

function renderProducts(products) {

  const container =
    document.getElementById("productContainer");


  // =================================================
  // EMPTY DATABASE
  // =================================================

  if (
    !products ||
    !products.length
  ) {

    container.innerHTML =

      `<div class="empty">

        <div class="empty-title">
          Database Belum Tersedia
        </div>

        <div class="empty-text">

          Data produk untuk divisi

          <strong>
            ${escapeHtml(
              getDivisionName(
                currentDivision
              )
            )}
          </strong>

          belum tersedia.

        </div>

      </div>`;

    return;

  }


  // =================================================
  // API SEKARANG SUDAH MENGIRIM
  // 1 PRODUCT + ARRAY VARIANTS
  // =================================================

  const productList =
    products.filter(product => {

      const code =
        String(
          product.ProductCode || ""
        ).trim();

      return code !== "";

    });


  // =================================================
  // PRODUCT COUNT
  // =================================================

  let html =

    `<div class="product-count">

      Total Product :
      <strong>
        ${productList.length}
      </strong>

    </div>`;


  // =================================================
  // PRODUCT CARD
  // =================================================

  productList.forEach(product => {

    let variantsHtml = "";


    const variants =
      Array.isArray(product.Variants)
        ? product.Variants
        : [];


    variants.forEach(
      variant => {

        const variantName =
          variant.Variant || "-";

        const variantPrice =
          variant.Price || "-";


        variantsHtml +=

          `<span
            class="product-variant">

            ${escapeHtml(
              variantName
            )}

            &nbsp;

            <strong>
              ${escapeHtml(
                formatPrice(
                  variantPrice
                )
              )}
            </strong>

          </span>`;

      }
    );


    // Jika tidak ada variant
    if (!variants.length) {

      variantsHtml =

        `<span
          class="product-variant">

          -

        </span>`;

    }


    html +=

      `<div
        class="product-card"
        data-product-code="${escapeHtml(
          product.ProductCode
        )}">


        <div class="product-name">

          ${escapeHtml(
            product.ProductName || "-"
          )}

        </div>


        <div class="product-meta">

          ${escapeHtml(
            product.Category || "-"
          )}

          •

          ${escapeHtml(
            product.Species || "-"
          )}

        </div>


        <div class="product-variants">

          ${variantsHtml}

        </div>


        <div class="product-detail-hint">

          Lihat Detail ›

        </div>


      </div>`;

  });


  container.innerHTML = html;


  // =================================================
  // CLICK PRODUCT CARD
  // =================================================

  const cards =
    container.querySelectorAll(
      ".product-card"
    );


  cards.forEach(card => {

    card.addEventListener(
      "click",
      function() {

        const code =
          this.dataset.productCode;

        openProductDetail(code);

      }
    );

  });

}


/* ===================================================
   OPEN PRODUCT DETAIL
   =================================================== */

function openProductDetail(
  productCode
) {

  const code =
    String(
      productCode || ""
    ).trim();


  // =================================================
  // CARI PRODUCT DARI API RESULT
  // =================================================

  const product =
    allProducts.find(
      item => {

        return (
          String(
            item.ProductCode || ""
          ).trim() === code
        );

      }
    );


  if (!product) {

    alert(
      "Detail produk tidak ditemukan."
    );

    return;

  }


  // =================================================
  // VARIANTS
  // =================================================

  const variants =
    Array.isArray(
      product.Variants
    )
      ? product.Variants
      : [];


  let variantsHtml = "";


  variants.forEach(
    variant => {

      variantsHtml +=

        `<span
          class="product-variant">

          ${escapeHtml(
            variant.Variant || "-"
          )}

          &nbsp;

          <strong>

            ${escapeHtml(
              formatPrice(
                variant.Price
              )
            )}

          </strong>

        </span>`;

    }
  );


  if (!variants.length) {

    variantsHtml =

      `<span
        class="product-variant">

        -

      </span>`;

  }


  // =================================================
  // HIDE ALL PAGE
  // =================================================

  document
    .getElementById("homePage")
    .classList.remove("active");


  document
    .getElementById("divisionPage")
    .classList.remove("active");


  // =================================================
  // SHOW DETAIL
  // =================================================

  document
    .getElementById("productDetailPage")
    .classList.add("active");


  // =================================================
  // TITLE
  // =================================================

  document
    .getElementById("productDetailTitle")
    .textContent =
      product.ProductName ||
      "Detail Produk";


  // =================================================
  // IMAGE
  // =================================================

  let imageHtml = "";


  if (
    product.Image &&
    String(
      product.Image
    ).trim()
  ) {

    imageHtml =

      `<img
        class="detail-image"
        src="${escapeHtml(
          product.Image
        )}"
        alt="${escapeHtml(
          product.ProductName || ""
        )}"
        onerror="this.style.display='none';">`;

  }


  // =================================================
  // DETAIL HTML
  // =================================================

  const container =
    document.getElementById(
      "productDetailContainer"
    );


  container.innerHTML =

    `<div class="detail-card">


      ${imageHtml}


      <div class="product-name">

        ${escapeHtml(
          product.ProductName || "-"
        )}

      </div>


      <div class="detail-section">

        <div class="detail-label">
          Product Code
        </div>

        <div class="detail-value">

          ${escapeHtml(
            product.ProductCode || "-"
          )}

        </div>

      </div>


      <div class="detail-section">

        <div class="detail-label">
          Division
        </div>

        <div class="detail-value">

          ${escapeHtml(
            getDivisionName(
              product.Division ||
              currentDivision
            )
          )}

        </div>

      </div>


      <div class="detail-section">

        <div class="detail-label">
          Category
        </div>

        <div class="detail-value">

          ${escapeHtml(
            product.Category || "-"
          )}

        </div>

      </div>


      <div class="detail-section">

        <div class="detail-label">
          Species
        </div>

        <div class="detail-value">

          ${escapeHtml(
            product.Species || "-"
          )}

        </div>

      </div>


      <div class="detail-section">

        <div class="detail-label">
          Variant & Price
        </div>

        <div class="product-variants">

          ${variantsHtml}

        </div>

      </div>


      <div class="detail-section">

        <div class="detail-label">
          Composition
        </div>

        <div class="detail-value">

          ${escapeHtml(
            product.Composition || "-"
          )}

        </div>

      </div>


      <div class="detail-section">

        <div class="detail-label">
          Function
        </div>

        <div class="detail-value">

          ${escapeHtml(
            product.Function || "-"
          )}

        </div>

      </div>


      <div class="detail-section">

        <div class="detail-label">
          Description
        </div>

        <div class="detail-value">

          ${escapeHtml(
            product.Description || "-"
          )}

        </div>

      </div>


      <div class="detail-section">

        <div class="detail-label">
          Problem / Symptom
        </div>

        <div class="detail-value">

          ${escapeHtml(
            product.Problem_Symptom || "-"
          )}

        </div>

      </div>


      <div class="detail-section">

        <div class="detail-label">
          Usage
        </div>

        <div class="detail-value">

          ${escapeHtml(
            product.Usage || "-"
          )}

        </div>

      </div>


    </div>`;

}

/* ===================================================
   CLOSE PRODUCT DETAIL
   =================================================== */

function closeProductDetail() {

  /*
   * Kembali ke division page,
   * bukan Home.
   */

  document
    .getElementById(
      "productDetailPage"
    )
    .classList.remove("active");


  document
    .getElementById(
      "homePage"
    )
    .classList.remove("active");


  document
    .getElementById(
      "divisionPage"
    )
    .classList.add("active");

}


/* ===================================================
   SEARCH
   =================================================== */

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    function() {

      clearTimeout(
        searchTimer
      );


      const search =
        this.value.trim();


      searchTimer =
        setTimeout(
          function() {

            loadProducts(
              search
            );

          },
          300
        );

    }
  );


/* ===================================================
   HOME
   =================================================== */

function goHome() {

  /*
   * Hide semua page
   */

  document
    .getElementById(
      "divisionPage"
    )
    .classList.remove("active");


  document
    .getElementById(
      "productDetailPage"
    )
    .classList.remove("active");


  /*
   * Show Home
   */

  document
    .getElementById(
      "homePage"
    )
    .classList.add("active");


  /*
   * Reset state
   */

  currentDivision = "";

  allProducts = [];


  /*
   * Reset search
   */

  document
    .getElementById(
      "searchInput"
    )
    .value = "";


  /*
   * Scroll ke paling atas
   */

  window.scrollTo({
    top: 0,
    behavior: "instant"
  });

}


/* ===================================================
   FORMAT PRICE
   =================================================== */

function formatPrice(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return "-";

  }


  const text =
    String(value).trim();


  /*
   * Jika sudah bukan angka murni,
   * tetap tampilkan nilai asli.
   */

  const number =
    Number(
      text.replace(
        /[^\d.-]/g,
        ""
      )
    );


  if (
    isNaN(number)
  ) {

    return text;

  }


  return (
    "Rp" +
    number.toLocaleString(
      "id-ID"
    )
  );

}


/* ===================================================
   HTML ESCAPE
   =================================================== */

function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}
